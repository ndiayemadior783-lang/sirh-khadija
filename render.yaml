services:
  - type: web
    name: sirh-khadija-rh
    runtime: php
    plan: free
    buildCommand: |
      composer install --no-dev --optimize-autoloader
      npm install
      npm run build
    startCommand: php artisan migrate --force && php artisan db:seed --force && php artisan serve --host=0.0.0.0 --port=$PORT
    autoDeploy: true
    healthCheckPath: /login
    disk:
      name: sirh-data
      mountPath: /app/database
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        value: https://sirh-khadija-rh.onrender.com
      - key: APP_KEY
        value: "base64:fXWSiObnTKiAIWBqpnEUwuBycB8gjWqBfm60nik+7q4="
      - key: DB_CONNECTION
        value: sqlite
      - key: SESSION_DRIVER
        value: database