services:
  - type: web
    name: sirh-khadija-rh
    runtime: docker
    plan: free
    dockerfilePath: Dockerfile
    autoDeploy: true
    healthCheckPath: /login
    # NOTE : le plan gratuit Render ne supporte PAS les persistent disks.
    # La base SQLite est creee a chaque demarrage (entrypoint.sh) puis les
    # migrations + seed sont executes : l'application est donc fonctionnelle
    # a chaque reveil, mais les donnees saisies ne survivent pas a un
    # redeploiement. Pour une base persistante (MySQL), voir
    # DEPLOIEMENT-PRODUCTION.md (cPanel / VPS).
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        value: https://sirh-khadija-rh.onrender.com
      - key: APP_KEY
        value: "base64:fXWSiObnTKiAIWBqpnEUwuBycB8gjWqBfm60nik+7q4="
      - key: DB_CONNECTION
        value: sqlite
      - key: SESSION_DRIVER
        value: database
